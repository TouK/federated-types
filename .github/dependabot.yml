# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://help.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
    - package-ecosystem: 'npm'
      directory: '/'
      target-branch: 'dev'
      schedule:
          interval: 'weekly'
      # Mirrors `min-release-age=7` in .npmrc: don't open PRs for versions
      # younger than a week — same window we expect malware to be detected in.
      cooldown:
          default-days: 7
      labels:
          - 'dependencies'
      groups:
          dev-dependencies:
              patterns:
                  - '@commitlint/*'
                  - '@semantic-release/*'
              update-types:
                  - 'minor'
                  - 'patch'

    - package-ecosystem: 'github-actions'
      directory: '/'
      target-branch: 'dev'
      schedule:
          interval: 'weekly'
      cooldown:
          default-days: 7
      labels:
          - 'dependencies'
          - 'github-actions'
