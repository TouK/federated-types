# This workflow will do a clean install of node dependencies, build the source code and run tests across different versions of node
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: CI

on:
    push:
        branches: [master, dev]
    pull_request:
        branches: [master, dev]

jobs:
    build:
        runs-on: ubuntu-latest

        strategy:
            matrix:
                node-version: [20.x, 22.x, 24.x]

        steps:
            - uses: actions/checkout@v6
            - uses: actions/cache@v4
              with:
                  path: |
                      **/node_modules
                  key: ${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
            - name: Use Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@v6
              with:
                  node-version: ${{ matrix.node-version }}
            - run: npm ci
            - run: npm run build --if-present
            - run: npm test
            - uses: codecov/codecov-action@v5
              if: matrix.node-version == '20.x'

    release:
        name: Release
        needs: ['build']
        runs-on: ubuntu-latest
        # Only run release on master (production) or dev (beta)
        if: github.event_name == 'push'
        permissions:
            contents: write
            issues: write
            pull-requests: write
            id-token: write
        steps:
            - uses: actions/checkout@v6
              with:
                  fetch-depth: 0
                  token: ${{ secrets.GITHUB_TOKEN }}
            - uses: actions/cache@v4
              with:
                  path: |
                      **/node_modules
                  key: ${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
            - uses: actions/setup-node@v6
              with:
                  node-version: 22
            - run: npm ci
            - run: npm run build --if-present
            - name: Release
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
              run: npx semantic-release

            # Sync dev branch with master after production release
            - name: Sync dev with master
              if: success() && github.ref == 'refs/heads/master'
              run: |
                  # Automatically sync dev branch after stable release
                  # This ensures hotfixes and version updates are in dev
                  git config --global user.name "github-actions[bot]"
                  git config --global user.email "github-actions[bot]@users.noreply.github.com"
                  git fetch origin dev:dev
                  git checkout dev
                  git merge master --no-edit -m "chore: sync dev with master after release [skip ci]"
                  git push origin dev
